# Build the Windows installer and publish a GitHub Release when a version tag is pushed.
# Usage: npm run release:patch  (or release:minor / release:major)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer and portable exe
        run: npm run dist:all

      - name: Generate release notes
        run: node scripts/generate-changelog.js

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pause ${{ github.ref_name }}
          body_path: CHANGELOG_RELEASE.md
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          fail_on_unmatched_files: false
